name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: |
            go.sum
            helper/go.sum
      - name: Check public source and scripts
        run: |
          python3 scripts/check_public.py
          python3 -m py_compile scripts/build.py scripts/check_public.py
          node --check web/app.js
          sh -n install.sh
          sh -n menu.sh
      - name: Build helper and download verified official test binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/dae-tests"
          go build -o "$RUNNER_TEMP/dae-tests/dae-manager" .
          (cd helper && go build -o "$RUNNER_TEMP/dae-tests/dae-helper" .)
          python3 - <<'PY'
          import gzip, hashlib, json, os, pathlib, subprocess, zipfile
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'dae-tests'
          specs = [
              ('daeuniverse/dae', 'v2.1.1', 'dae-linux-x86_64.zip', 'dae'),
              ('MetaCubeX/mihomo', 'v1.19.33', 'mihomo-linux-amd64-compatible-v1.19.33.gz', 'mihomo'),
          ]
          for repo, tag, name, binary in specs:
              release = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/releases/tags/{tag}']))
              asset = next(a for a in release['assets'] if a['name'] == name)
              subprocess.run(['gh', 'release', 'download', tag, '--repo', repo, '--pattern', name, '--dir', str(folder)], check=True)
              path = folder / name
              assert asset.get('digest') == 'sha256:' + hashlib.sha256(path.read_bytes()).hexdigest(), 'Official asset checksum mismatch'
              if name.endswith('.zip'):
                  with zipfile.ZipFile(path) as archive:
                      member = next(n for n in archive.namelist() if pathlib.PurePosixPath(n).name == 'dae-linux-x86_64')
                      data = archive.read(member)
              else:
                  data = gzip.decompress(path.read_bytes())
              (folder / binary).write_bytes(data)
              (folder / binary).chmod(0o755)
          PY
      - name: Test and vet both modules
        run: |
          export DAE_TEST_BINARY="$RUNNER_TEMP/dae-tests/dae"
          export MRS_TEST_BINARY="$RUNNER_TEMP/dae-tests/mihomo"
          export DAE_MANAGER_HELPER="$RUNNER_TEMP/dae-tests/dae-helper"
          go test -race -count=1 ./...
          go vet ./...
          (cd helper && go test -race -count=1 ./... && go vet ./...)
